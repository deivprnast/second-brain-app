<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>🧠 Myšlenková mapa | Druhý mozek</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6">
  <div id="loaderBox" class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-6 text-center space-y-4 shadow-xl">
    <div class="text-3xl">🔒</div>
    <h1 class="text-lg font-extrabold">Ověřování přístupu k soukromému trezoru...</h1>
    <p id="statusText" class="text-xs text-slate-400">Načítání mapy ze soukromého repozitáře (podpora Offline režimu)...</p>
    <a href="./index.html" class="inline-block px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-xs font-bold">← Zpět do kokpitu</a>
  </div>

  <script>
    (async function loadPrivateMap() {
      const token = localStorage.getItem('github_token') || localStorage.getItem('sb_github_token');
      const statusEl = document.getElementById('statusText');
      if (!token) {
        statusEl.textContent = 'Chybí autorizační GitHub token. Přihlas se nejprve v hlavním okně aplikace.';
        return;
      }
      try {
        const res = await fetch('https://api.github.com/repos/deivprnast/david-second-brain/contents/BRAIN/MAPA_ZIVOTA_DAVID_PRYCL.html', {
          headers: {
            'Authorization': 'Bearer ' + token,
            'Accept': 'application/vnd.github.v3.raw'
          }
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const html = await res.text();
        try { localStorage.setItem('sb_cache_mapa_html', html); } catch (err) {}
        document.open();
        document.write(html);
        document.close();
      } catch (e) {
        const cached = localStorage.getItem('sb_cache_mapa_html');
        if (cached) {
          document.open();
          document.write(cached);
          document.close();
          return;
        }
        statusEl.textContent = 'Nepodařilo se načíst soukromou mapu (' + e.message + ') a offline kopie zatím není v mezipaměti.';
      }
    })();
  </script>
</body>
</html>
